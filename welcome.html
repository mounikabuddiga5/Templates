```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employee Management System</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;

            width: 420px;

            padding: 40px;

            border-radius: 15px;

            text-align: center;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #333;

            margin-bottom: 10px;
        }

        p {
            color: #666;

            margin-bottom: 30px;
        }

        .btn {
            display: block;

            width: 100%;

            padding: 14px;

            margin: 15px 0;

            border: none;

            border-radius: 8px;

            text-decoration: none;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        .login {
            background: #667eea;

            color: white;
        }

        .register {
            background: #764ba2;

            color: white;
        }

        .btn:hover {
            opacity: 0.85;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Employee Management System</h1>

        <p>Please Login or Register to continue</p>

        <a href="/login" class="btn login">
            Login
        </a>

        <a href="/register" class="btn register">
            Register
        </a>

    </div>

</body>

</html>
```

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - Employee Management System</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            min-height: 100vh;
        }

        /* ================= NAVBAR ================= */

        .navbar {
            background-color: #222;
            padding: 15px 30px;
            display: flex;
            align-items: center;
        }

        .logo {
            color: white;
            font-size: 22px;
            font-weight: bold;
            margin-right: auto;
        }

        .nav-links {
            display: flex;
            align-items: center;
            list-style: none;
            gap: 20px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 16px;
        }

        .nav-links a:hover {
            color: #00bcd4;
        }

        .login-btn {
            border: 1px solid #00bcd4;
            padding: 8px 15px;
            border-radius: 5px;
        }

        .login-btn:hover {
            background-color: #00bcd4;
            color: white !important;
        }

        /* ================= REGISTER CONTAINER ================= */

        .register-container {
            width: 450px;
            max-width: 90%;
            margin: 60px auto;
            background-color: white;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.12);
        }

        .register-container h2 {
            text-align: center;
            color: #222;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
            font-size: 14px;
        }

        /* ================= FORM ================= */

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #333;
            font-weight: bold;
            font-size: 15px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #00bcd4;
            box-shadow: 0 0 4px rgba(0, 188, 212, 0.3);
        }

        /* ================= BUTTONS ================= */

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        .register-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background-color: #00bcd4;
            color: white;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        .register-btn:hover {
            background-color: #0097a7;
        }

        .reset-btn {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            background-color: white;
            color: #333;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        .reset-btn:hover {
            background-color: #f0f0f0;
        }

        /* ================= LOGIN LINK ================= */

        .login-text {
            text-align: center;
            margin-top: 25px;
            color: #777;
            font-size: 14px;
        }

        .login-text a {
            color: #00a6bd;
            text-decoration: none;
            font-weight: bold;
        }

        .login-text a:hover {
            text-decoration: underline;
        }

        /* ================= MOBILE ================= */

        @media (max-width: 600px) {

            .navbar {
                padding: 15px;
            }

            .logo {
                font-size: 18px;
            }

            .nav-links {
                gap: 10px;
            }

            .nav-links li:nth-child(1) {
                display: none;
            }

            .register-container {
                margin-top: 35px;
                padding: 25px;
            }

        }

    </style>

</head>

<body>


    <!-- ================= NAVBAR ================= -->

    <nav class="navbar">

        <div class="logo">
            Employee Management System
        </div>

        <ul class="nav-links">

            <li>
                <a href="/">
                    Home
                </a>
            </li>

            <li>
                <a href="/login"
                   class="login-btn">
                    Login
                </a>
            </li>

        </ul>

    </nav>


    <!-- ================= REGISTER FORM ================= -->

    <div class="register-container">

        <h2>
            Create Account
        </h2>

        <p class="subtitle">
            Register to access the Employee Management System
        </p>


        <form action="/register"
              method="POST">


            <!-- FULL NAME -->

            <div class="form-group">

                <label for="fullname">
                    Full Name
                </label>

                <input
                    type="text"
                    id="fullname"
                    name="fullname"
                    placeholder="Enter your full name"
                    required>

            </div>


            <!-- USERNAME -->

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    required>

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required>

            </div>


            <!-- BUTTONS -->

            <div class="button-group">

                <button
                    type="submit"
                    class="register-btn">

                    Register

                </button>

                <button
                    type="reset"
                    class="reset-btn">

                    Reset

                </button>

            </div>


        </form>


        <!-- LOGIN -->

        <p class="login-text">

            Already have an account?

            <a href="/login">
                Login here
            </a>

        </p>

    </div>


</body>

</html>
